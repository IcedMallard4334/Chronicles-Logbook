site_name: Chronicles
site_description: A customisable digital logbook for tracking project work
site_url: https://chronicles-drivenbydesign-docs.azurewebsites.net/

# Emit api/entries.html rather than api/entries/index.html. The docs are
# served by `pm2 serve`, which has no directory-index handling — a request for
# a directory fails with EISDIR. Plain files sidestep that entirely.
use_directory_urls: false

repo_url: https://sdp.ms.wits.ac.za/driven-by-design/Chronicles
repo_name: driven-by-design/Chronicles

# `mkdocs serve` defaults to port 8000, which is also where the backend runs.
# On Windows the docs server's 127.0.0.1 bind wins over uvicorn's 0.0.0.0 one,
# so running both silently sends every API call to the docs site — which answers
# 404 with no CORS headers, and so reads in the browser as a CORS failure.
dev_addr: 127.0.0.1:8001

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Home: index.md
  - Release Notes: release-notes.md
  - Getting Started:
    - Prerequisites: getting-started/prerequisites.md
    - Installation: getting-started/installation.md
    - Running the Project: getting-started/running.md
  - Architecture:
    - Overview: architecture/overview.md
    - Backend: architecture/backend.md
    - Frontend: architecture/frontend.md
    - Database: architecture/database.md
    - Use Case Diagrams: architecture/use-case-diagrams.md
    - Authentication & Azure: architecture/authentication-and-azure.md
  - API Reference:
    - Authentication: api/authentication.md
    - Projects: api/projects.md
    - Schema and field types: api/schema.md
    - Entries: api/entries.md
    - Tasks: api/tasks.md
    - Statistics: api/statistics.md
    - Sharing: api/sharing.md
    - Export and import: api/transfer.md
  - Development:
    - Contributing: development/contributing.md
    - Testing: development/testing.md
    - Third-Party Code: development/third-party-code.md
    - Deployment: development/deployment.md
  - Methodology:
    - Project Methodology: methodology/project-methodology.md
    - Git Workflow: methodology/git-workflow.md
    - Sprint 1 Meetings: methodology/sprint-meetings.md
    - Sprint 1 Review: methodology/sprint-review.md
    - Sprint 1 Retrospective: methodology/sprint-1-retrospective.md
    - Sprint 2 Meetings: methodology/sprint-2-meetings.md
    - Sprint 2 Plan: methodology/sprint-2-plan.md
    - Sprint 2 Review: methodology/sprint-2-review.md
    - Sprint 3 Log (Person 4): methodology/sprint-3-log.md
    - User Feedback: methodology/user-feedback.md
    - Potential Risks: methodology/risks.md