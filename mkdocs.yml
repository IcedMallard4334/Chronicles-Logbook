site_name: Chronicles
site_description: A customisable digital logbook for tracking project work
site_url: https://chronicles-drivenbydesign-app-hfeehwdce7dfd9fr.uaenorth-01.azurewebsites.net/docs/

repo_url: https://sdp.ms.wits.ac.za/driven-by-design/Chronicles
repo_name: driven-by-design/Chronicles

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Home: index.md
  - Getting Started:
    - Prerequisites: getting-started/prerequisites.md
    - Installation: getting-started/installation.md
    - Running the Project: getting-started/running.md
  - Architecture:
    - Overview: architecture/overview.md
    - Backend: architecture/backend.md
    - Frontend: architecture/frontend.md
    - Database: architecture/database.md
    - Use Case Diagrams: architecture/use-case-diagrams.md
    - Authentication & Azure: architecture/authentication-and-azure.md
  - API Reference:
    - Authentication: api/authentication.md
    - Projects: api/projects.md
    - Entries: api/entries.md
    - Tasks: api/tasks.md
  - Development:
    - Contributing: development/contributing.md
    - Testing: development/testing.md
    - Deployment: development/deployment.md
  - Methodology:
    - Project Methodology: methodology/project-methodology.md
    - Git Workflow: methodology/git-workflow.md
    - Sprint Meetings: methodology/sprint-meetings.md
    - Sprint Review: methodology/sprint-review.md
    - Potential Risks: methodology/risks.md
