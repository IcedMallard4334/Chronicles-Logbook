name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  deploy_backend:
    runs-on: windows
    defaults:
      run:
        shell: pwsh
        working-directory: chronicles-logbook/backend
    steps:
      - uses: actions/checkout@v4

      # No Python setup or dependency install here on purpose. This job ships
      # source: the zip is built from the checked-out folder and Azure installs
      # dependencies itself during the Oryx build
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true on the App Service).
      #
      # Anything pip installed on the runner went into the runner's own Python
      # and was never added to the zip, so those steps had no effect on what
      # was deployed — while actions/setup-python repeatedly damaged the Python
      # installation on the self-hosted Windows runner.

      - name: Zip backend package
        shell: pwsh
        run: |
          Compress-Archive -Path * -DestinationPath ..\backend.zip -Force
        working-directory: chronicles-logbook/backend

      - name: Deploy backend to Azure App Service
        shell: pwsh
        env:
          AZURE_BACKEND_PUBLISH_PROFILE: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
        run: |
          $profile = [xml]$env:AZURE_BACKEND_PUBLISH_PROFILE
          $entry = $profile.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1
          Write-Host "Deploying to: $($entry.publishUrl)"
          $uri = "https://$($entry.publishUrl)/api/zipdeploy"
          $creds = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($entry.userName):$($entry.userPWD)"))
          Invoke-RestMethod -Uri $uri `
            -Method POST `
            -Headers @{ Authorization = "Basic $creds" } `
            -InFile ..\backend.zip `
            -ContentType 'application/zip'
        working-directory: chronicles-logbook/backend

  deploy_frontend:
    runs-on: windows
    defaults:
      run:
        shell: pwsh
        working-directory: chronicles-logbook/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build frontend
        env:
          VITE_API_URL: ${{ secrets.BACKEND_URL }}
        run: |
          npm ci
          npm run build

      - name: Zip frontend dist
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ..\frontend.zip -Force
        working-directory: chronicles-logbook/frontend

      - name: Deploy frontend to Azure App Service
        shell: pwsh
        env:
          AZURE_FRONTEND_PUBLISH_PROFILE: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
        run: |
          $profile = [xml]$env:AZURE_FRONTEND_PUBLISH_PROFILE
          $entry = $profile.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1
          $uri = "https://$($entry.publishUrl)/api/zipdeploy"
          $creds = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($entry.userName):$($entry.userPWD)"))
          Invoke-RestMethod -Uri $uri `
            -Method POST `
            -Headers @{ Authorization = "Basic $creds" } `
            -InFile ..\frontend.zip `
            -ContentType 'application/zip'
        working-directory: chronicles-logbook/frontend