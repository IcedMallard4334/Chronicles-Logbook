name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  deploy_backend:
    runs-on: windows
    defaults:
      run:
        shell: pwsh
        working-directory: chronicles-logbook/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "chronicles-api"
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: chronicles-logbook/backend

  deploy_frontend:
    runs-on: windows
    defaults:
      run:
        shell: pwsh
        working-directory: chronicles-logbook/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build frontend
        env:
          VITE_API_URL: ${{ secrets.BACKEND_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "chronicles-web-app"
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: chronicles-logbook/frontend