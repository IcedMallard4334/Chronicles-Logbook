name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chronicles-logbook/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies into antenv
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Zip backend package
        run: zip -r ../backend.zip .

      - name: Deploy backend to Azure App Service
        env:
          AZURE_BACKEND_PUBLISH_PROFILE: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
        run: |
          python - <<'PY'
          import base64, os, xml.etree.ElementTree as ET
          from urllib.request import Request, urlopen
          profile = ET.fromstring(os.environ['AZURE_BACKEND_PUBLISH_PROFILE'])
          entry = next(p for p in profile.iter('publishProfile') if p.get('publishMethod') == 'ZipDeploy')
          uri = f"https://{entry.get('publishUrl')}/api/zipdeploy"
          creds = base64.b64encode(f"{entry.get('userName')}:{entry.get('userPWD')}".encode()).decode()
          with open('../backend.zip', 'rb') as f:
              req = Request(uri, data=f.read(), method='POST')
              req.add_header('Authorization', f'Basic {creds}')
              req.add_header('Content-Type', 'application/zip')
              with urlopen(req) as resp:
                  print(resp.read().decode())
          PY

  deploy_frontend:
    runs-on: windows
    defaults:
      run:
        shell: pwsh
        working-directory: chronicles-logbook/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build frontend
        env:
          VITE_API_URL: ${{ secrets.BACKEND_URL }}
        run: |
          npm ci
          npm run build

      - name: Zip frontend dist
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ..\frontend.zip -Force
        working-directory: chronicles-logbook/frontend

      - name: Deploy frontend to Azure App Service
        shell: pwsh
        env:
          AZURE_FRONTEND_PUBLISH_PROFILE: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
        run: |
          $profile = [xml]$env:AZURE_FRONTEND_PUBLISH_PROFILE
          $entry = $profile.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1
          $uri = "https://$($entry.publishUrl)/api/zipdeploy"
          $creds = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($entry.userName):$($entry.userPWD)"))
          Invoke-RestMethod -Uri $uri `
            -Method POST `
            -Headers @{ Authorization = "Basic $creds" } `
            -InFile ..\frontend.zip `
            -ContentType 'application/zip'
        working-directory: chronicles-logbook/frontend