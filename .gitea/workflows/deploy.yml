name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  deploy_backend:
    runs-on: windows
    defaults:
      run:
        shell: pwsh
        working-directory: chronicles-logbook/backend
    steps:
      - uses: actions/checkout@v4

      # No Python setup or dependency install here on purpose. This job ships
      # source: the zip is built from the checked-out folder and Azure installs
      # dependencies itself during the Oryx build
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true on the App Service).
      #
      # Anything pip installed on the runner went into the runner's own Python
      # and was never added to the zip, so those steps had no effect on what
      # was deployed — while actions/setup-python repeatedly damaged the Python
      # installation on the self-hosted Windows runner.

      - name: Zip backend package
        shell: pwsh
        run: |
          Compress-Archive -Path * -DestinationPath ..\backend.zip -Force
        working-directory: chronicles-logbook/backend

      - name: Deploy backend to Azure App Service
        shell: pwsh
        env:
          AZURE_BACKEND_PUBLISH_PROFILE: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
        run: |
          $profile = [xml]$env:AZURE_BACKEND_PUBLISH_PROFILE
          $entry = $profile.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1
          Write-Host "Deploying to: $($entry.publishUrl)"
          $creds = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($entry.userName):$($entry.userPWD)"))
          $headers = @{ Authorization = "Basic $creds" }

          # A plain (synchronous) zipdeploy call blocks on this request until
          # Oryx finishes installing dependencies on the server, which for
          # this app routinely runs past the platform's own gateway timeout
          # (~230s) and fails the job with a 504 even when the deployment
          # goes on to succeed anyway. isAsync starts the deployment and
          # hands back a status URL, so we can wait it out ourselves instead
          # of racing the gateway's clock.
          $deployUri = "https://$($entry.publishUrl)/api/zipdeploy?isAsync=true"
          $response = Invoke-WebRequest -Uri $deployUri -Method POST -Headers $headers -InFile ..\backend.zip -ContentType 'application/zip'
          $statusUri = $response.Headers['Location'] | Select-Object -First 1
          if (-not $statusUri) { throw "zipdeploy did not return a deployment status URL to poll." }

          Write-Host "Deployment started. Polling: $statusUri"
          $deadline = (Get-Date).AddMinutes(15)
          do {
            Start-Sleep -Seconds 10
            $status = Invoke-RestMethod -Uri $statusUri -Headers $headers
            Write-Host "Status: $($status.status_text) (complete=$($status.complete))"
          } until ($status.complete -or (Get-Date) -gt $deadline)

          if (-not $status.complete) { throw "Deployment did not finish within 15 minutes." }
          if ($status.status -ne 4) { throw "Deployment failed: $($status.status_text)" }
          Write-Host "Deployment succeeded."
        working-directory: chronicles-logbook/backend

  deploy_frontend:
    runs-on: windows
    defaults:
      run:
        shell: pwsh
        working-directory: chronicles-logbook/frontend
    steps:
      - uses: actions/checkout@v4

      # Node is pre-installed on the runner machine, so there is no
      # actions/setup-node step (it needs admin rights on Windows host runners).

      - name: Install and build frontend
        env:
          VITE_API_URL: ${{ secrets.BACKEND_URL }}
        run: |
          npm ci
          npm run build

      - name: Zip frontend dist
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ..\frontend.zip -Force
        working-directory: chronicles-logbook/frontend

      - name: Deploy frontend to Azure App Service
        shell: pwsh
        env:
          AZURE_FRONTEND_PUBLISH_PROFILE: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
        run: |
          $profile = [xml]$env:AZURE_FRONTEND_PUBLISH_PROFILE
          $entry = $profile.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1
          $uri = "https://$($entry.publishUrl)/api/zipdeploy"
          $creds = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($entry.userName):$($entry.userPWD)"))
          Invoke-RestMethod -Uri $uri `
            -Method POST `
            -Headers @{ Authorization = "Basic $creds" } `
            -InFile ..\frontend.zip `
            -ContentType 'application/zip'
        working-directory: chronicles-logbook/frontend